<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoraSol AI — Indigenous Energy Assistant</title>
  <link rel="icon" type="image/jpeg" href="Images/norasol%20icon.jpg">
  
  <!-- Early Theme Initializer -->
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('norasol-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Single Font Family: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brandGreen: {
              DEFAULT: '#1E7538',
              hover: '#165B2B',
              light: '#EAF4EE',
              darkAccent: '#34D399',
            },
            brandBlack: {
              DEFAULT: '#0C130F',
              muted: '#36433C',
              slate: '#607067',
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #F4F7F4;
      color: #0C130F;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .apple-glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 16px 36px -12px rgba(12, 19, 15, 0.08), inset 0 1px 1px 0 rgba(255, 255, 255, 0.95);
    }

    html.dark body {
      background: #080D0A;
      color: #F3F6F4;
    }
    html.dark .apple-glass {
      background: rgba(16, 25, 20, 0.82);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.6), inset 0 1px 1px 0 rgba(255, 255, 255, 0.12);
    }
    html.dark .bg-white {
      background-color: #121C16 !important;
    }
    html.dark .bg-white\/80,
    html.dark .bg-white\/70 {
      background-color: rgba(18, 28, 23, 0.75) !important;
    }
    html.dark .bg-white\/40 {
      background-color: rgba(18, 28, 23, 0.45) !important;
    }
    html.dark .text-brandBlack {
      color: #F3F6F4 !important;
    }
    html.dark .text-brandBlack-slate {
      color: #8E9F96 !important;
    }
    html.dark .border-black\/5,
    html.dark .border-black\/10 {
      border-color: rgba(255, 255, 255, 0.1) !important;
    }
    html.dark input {
      background-color: #0F1713 !important;
      color: #F3F6F4 !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
    }
    html.dark input::placeholder {
      color: #6B7C72 !important;
    }
    html.dark .brand-emblem-box {
      background-color: #FFFFFF !important;
    }
  </style>
</head>
<body class="p-3 sm:p-6 flex items-center justify-center">

  <div class="apple-glass w-full max-w-3xl h-[92vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl">
    
    <!-- Top Header -->
    <div class="px-6 py-4 bg-white/70 border-b border-black/5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="brand-emblem-box w-10 h-10 rounded-2xl overflow-hidden p-1 bg-white border border-black/5 flex items-center justify-center">
          <img src="Images/norasol%20logo.png" alt="NoraSol" class="w-full h-full object-contain">
        </a>
        <div>
          <div class="text-sm font-bold text-brandBlack flex items-center gap-2">
            <span>NoraSol AI Engineer</span>
            <span class="w-2 h-2 rounded-full bg-brandGreen"></span>
          </div>
          <div class="text-[11px] text-brandBlack-slate">Indigenous Clean Energy Assistant · Islamabad R&D</div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button 
          onclick="toggleTheme()" 
          class="theme-toggle-btn px-2.5 py-1.5 rounded-xl bg-white/80 hover:bg-white border border-black/10 flex items-center gap-1.5 text-brandBlack hover:text-brandGreen transition-all active:scale-95 shadow-xs" 
          title="Toggle Light / Dark Mode"
        >
          <i class="theme-toggle-icon fa-solid fa-sun text-xs text-brandGreen"></i>
          <span class="theme-toggle-label text-[11px] font-semibold">Light Mode</span>
        </button>
        <a href="/" class="text-xs font-bold text-brandGreen hover:underline flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Return to Website</span>
        </a>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="chatMessages" class="flex-1 p-6 overflow-y-auto space-y-4 text-sm"></div>

    <!-- Quick Prompts Chips -->
    <div class="px-6 py-3 bg-white/40 border-t border-black/5 flex items-center gap-2 overflow-x-auto text-xs whitespace-nowrap">
      <button class="chip px-3.5 py-1.5 rounded-xl bg-white hover:bg-white/80 border border-black/5 text-brandBlack font-medium transition-colors" data-question="Tell me about the NORA-3 3kW inverter and integrated battery.">
        NORA-3 System
      </button>
      <button class="chip px-3.5 py-1.5 rounded-xl bg-white hover:bg-white/80 border border-black/5 text-brandBlack font-medium transition-colors" data-question="How does the zero-export CT sensor work without a green meter?">
        Zero-Export CT Sensor
      </button>
      <button class="chip px-3.5 py-1.5 rounded-xl bg-white hover:bg-white/80 border border-black/5 text-brandBlack font-medium transition-colors" data-question="What are the battery choices in the NoraStore series?">
        NoraStore Series
      </button>
      <button class="chip px-3.5 py-1.5 rounded-xl bg-white hover:bg-white/80 border border-black/5 text-brandBlack font-medium transition-colors" data-question="What is the estimated electricity savings and ROI?">
        Price & ROI
      </button>
    </div>

    <!-- Input Form -->
    <form id="chatForm" class="p-4 bg-white/70 border-t border-black/5 flex items-center gap-2">
      <input 
        id="chatInput" 
        type="text" 
        placeholder="Ask about inverters, zero-export CT, batteries, or ROI..." 
        autocomplete="off" 
        class="flex-1 bg-white border border-black/10 focus:border-brandGreen rounded-xl px-4 py-3 text-sm text-brandBlack focus:outline-none transition-colors"
      />
      <button 
        id="sendBtn" 
        type="submit" 
        class="px-6 py-3 rounded-xl bg-brandGreen text-white font-bold text-sm hover:bg-brandGreen-hover active:scale-95 transition-all whitespace-nowrap"
      >
        <i class="fa-solid fa-paper-plane mr-1.5"></i>Send
      </button>
    </form>

  </div>

  <script>
    const messagesContainer = document.getElementById('chatMessages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const history = [];

    function addMessage(text, role = 'assistant') {
      const bubbleWrapper = document.createElement('div');
      bubbleWrapper.className = role === 'user' ? 'flex justify-end' : 'flex gap-3 max-w-[85%]';

      if (role === 'user') {
        bubbleWrapper.innerHTML = `
          <div class="p-4 rounded-2xl bg-brandGreen text-white font-semibold leading-relaxed shadow-sm">
            ${text}
          </div>
        `;
      } else {
        const parsed = window.marked && window.DOMPurify 
          ? DOMPurify.sanitize(marked.parse(String(text || ''))) 
          : text;
        bubbleWrapper.innerHTML = `
          <div class="w-8 h-8 rounded-xl bg-brandGreen-light flex-shrink-0 flex items-center justify-center text-brandGreen text-xs font-bold">
            <i class="fa-solid fa-microchip"></i>
          </div>
          <div class="p-4 rounded-2xl bg-white border border-black/5 text-brandBlack leading-relaxed space-y-2 shadow-sm">
            ${parsed}
          </div>
        `;
      }

      messagesContainer.appendChild(bubbleWrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function handleSend(userMsg) {
      if (!userMsg) return;
      addMessage(userMsg, 'user');
      history.push({ role: 'user', content: userMsg });

      input.disabled = true;
      sendBtn.disabled = true;
      input.placeholder = 'NoraSol AI is thinking...';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: userMsg,
            sessionMessages: history
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const reply = data.reply || 'Thank you for your question. How can we assist you with NoraSol setups?';

        addMessage(reply, 'assistant');
        history.push({ role: 'assistant', content: reply });
      } catch (err) {
        console.error(err);
        addMessage('Our systems achieve full return on investment (ROI) within 2 to 3 years. For pricing quotes and inquiries, please connect with our Islamabad office on WhatsApp at +92 322 8650402.', 'assistant');
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.placeholder = 'Ask about inverters, zero-export CT, batteries, or ROI...';
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      handleSend(val);
    });

    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        handleSend(btn.getAttribute('data-question'));
      });
    });

    // Theme Controller
    function initTheme() {
      const saved = localStorage.getItem('norasol-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved ? saved : (prefersDark ? 'dark' : 'light');
      applyTheme(theme);
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const icons = document.querySelectorAll('.theme-toggle-icon');
      const labels = document.querySelectorAll('.theme-toggle-label');

      if (theme === 'dark') {
        html.classList.add('dark');
        icons.forEach(icon => {
          icon.className = 'theme-toggle-icon fa-solid fa-moon text-xs text-brandGreen';
        });
        labels.forEach(lbl => {
          lbl.textContent = 'Dark Mode';
        });
        try { localStorage.setItem('norasol-theme', 'dark'); } catch (e) {}
      } else {
        html.classList.remove('dark');
        icons.forEach(icon => {
          icon.className = 'theme-toggle-icon fa-solid fa-sun text-xs text-brandGreen';
        });
        labels.forEach(lbl => {
          lbl.textContent = 'Light Mode';
        });
        try { localStorage.setItem('norasol-theme', 'light'); } catch (e) {}
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    }

    initTheme();

    addMessage('Hello! I am the official NoraSol AI Assistant. How can I assist you with our indigenous NORA-3 hybrid inverter, 204V LiFePO4 batteries, or solar ROI calculations today?');
  </script>
</body>
</html>
